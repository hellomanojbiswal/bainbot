name: Test Bainbot
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: bainbot_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest backend/test_app.py backend/test_deployment.py backend/test_saas.py backend/test_integrations.py -q
      - run: python -m pytest backend/test_postgres.py -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/bainbot_test
      - run: node --check dist/app.js && node --check dist/auth.js
      - run: node scripts/check_frontend.cjs
